<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenCycle — Pass on your school books</title>
  <meta name="description" content="A free way for students and parents in Oman to give away school books they no longer need.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf6ef;
      --bg-card: #ffffff;
      --green-dark: #2f5e44;
      --green: #4a7a5b;
      --sage: #7a9a6a;
      --sage-light: #d4e4c8;
      --brown: #8b6f47;
      --gold: #c9a961;
      --text: #1f2e25;
      --text-muted: #6a7a6f;
      --border: #e3dccd;
      --shadow: 0 1px 3px rgba(31,46,37,0.06), 0 4px 12px rgba(31,46,37,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }

    header { background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; max-width: 1100px; margin: 0 auto; }
    .logo { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 700; color: var(--green-dark); display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--green-dark); }
    .btn-primary { background: var(--green-dark); color: white; padding: 9px 18px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 0.95rem; border: none; cursor: pointer; }
    .btn-primary:hover { background: #234534; }

    .hero { padding: 60px 24px 40px; text-align: center; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; margin-bottom: 16px; color: var(--green-dark); }
    .hero h1 em { font-style: italic; color: var(--brown); }
    .hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 580px; margin: 0 auto; }

    .filters { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin: 0 auto 32px; max-width: 1052px; box-shadow: var(--shadow); }
    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
    .filter-grid input, .filter-grid select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; background: var(--bg); color: var(--text); width: 100%; }
    .filter-grid input:focus, .filter-grid select:focus { outline: none; border-color: var(--sage); background: white; }

    .listings { padding-bottom: 80px; }
    .listings-meta { max-width: 1052px; margin: 0 auto 16px; padding: 0 24px; color: var(--text-muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1052px; margin: 0 auto; padding: 0 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: var(--shadow); }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(31,46,37,0.08); }
    .card-image { aspect-ratio: 4/3; background: linear-gradient(135deg, var(--sage-light), #c8dcb6); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--green); }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px; }
    .card-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: var(--text); line-height: 1.3; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
    .tag-grade { background: var(--sage-light); color: var(--green-dark); }
    .tag-subject { background: #f0e8d6; color: var(--brown); }
    .tag-condition { background: #fff; border: 1px solid var(--border); color: var(--text-muted); }
    .tag-condition.new { background: var(--sage-light); color: var(--green-dark); border-color: transparent; }
    .card-school { font-size: 0.85rem; color: var(--text-muted); }

    .empty, .loading { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(31,46,37,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-backdrop.hidden { display: none; }
    .modal { background: var(--bg-card); border-radius: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(31,46,37,0.25); position: relative; }
    .modal-image { aspect-ratio: 16/9; background: linear-gradient(135deg, var(--sage-light), #c8dcb6); display: flex; align-items: center; justify-content: center; font-size: 5rem; border-radius: 16px 16px 0 0; }
    .modal-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px 16px 0 0; }
    .modal-body { padding: 28px; }
    .modal h2 { font-size: 1.6rem; margin-bottom: 12px; color: var(--green-dark); }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .modal-section { margin-bottom: 18px; }
    .modal-section h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; font-family: 'Inter', sans-serif; font-weight: 600; }
    .contact-card { background: var(--bg); border-left: 3px solid var(--green); padding: 14px 16px; border-radius: 8px; }
    .contact-name { font-weight: 600; margin-bottom: 4px; }
    .contact-link { display: inline-flex; align-items: center; gap: 6px; color: var(--green-dark); text-decoration: none; font-weight: 500; }
    .contact-link:hover { text-decoration: underline; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; color: var(--text); }

    footer { border-top: 1px solid var(--border); padding: 32px 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    footer a { color: var(--green-dark); }

    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
      .filter-grid input { grid-column: 1 / -1; }
      .nav-links { gap: 12px; }
      .nav-links a { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">🌿 GreenCycle</div>
      <div class="nav-links">
        <a href="#browse">Browse</a>
        <a href="#" class="btn-primary">Sign in</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Pass your school books on, <em>not into the bin.</em></h1>
      <p>A free, friendly way for students and parents in Oman to share textbooks at the end of the year. Find what you need, give what you don't.</p>
    </section>

    <section class="filters" id="browse">
      <div class="filter-grid">
        <input type="search" id="search" placeholder="Search by title or subject…">
        <select id="grade-filter">
          <option value="">All grades</option>
          <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
          <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
          <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
          <option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
        </select>
        <select id="subject-filter">
          <option value="">All subjects</option>
          <option>Math</option><option>Science</option><option>English</option>
          <option>Arabic</option><option>Social Studies</option><option>Business</option>
        </select>
        <select id="condition-filter">
          <option value="">All conditions</option>
          <option value="new">New</option>
          <option value="good">Good</option>
          <option value="worn">Worn</option>
        </select>
      </div>
    </section>

    <section class="listings">
      <div class="listings-meta" id="listings-meta">Loading…</div>
      <div class="grid" id="listings-grid">
        <div class="loading">Fetching listings…</div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal-backdrop hidden"></div>

  <footer>
    <p>Made with 🌿 in Oman · <a href="mailto:hello@greencycle.om">hello@greencycle.om</a></p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    // ============================================================
    // PASTE YOUR SUPABASE VALUES HERE
    // ============================================================
    const SUPABASE_URL = 'https://wvladknkebqiqutboohw.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_J0JrrWBQipfP201_L3A0pw_UGF6R1qL'
    // ============================================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
    let allListings = []

    async function loadListings() {
      const { data, error } = await supabase
        .from('listings')
        .select('*')
        .eq('status', 'available')
        .order('created_at', { ascending: false })

      if (error) {
        console.error('Supabase error:', error)
        document.getElementById('listings-grid').innerHTML =
          `<div class="empty">Couldn't load listings. Open the browser console (right-click → Inspect → Console) for details.</div>`
        document.getElementById('listings-meta').textContent = 'Error loading'
        return
      }
      allListings = data || []
      renderListings(allListings)
    }

    function renderListings(listings) {
      const grid = document.getElementById('listings-grid')
      const meta = document.getElementById('listings-meta')
      meta.textContent = listings.length === 1 ? '1 book available' : `${listings.length} books available`

      if (listings.length === 0) {
        grid.innerHTML = '<div class="empty">No books match your filters. Try clearing them.</div>'
        return
      }

      grid.innerHTML = listings.map(l => `
        <article class="card" data-id="${l.id}">
          <div class="card-image">
            ${l.photo_url ? `<img src="${escapeHtml(l.photo_url)}" alt="${escapeHtml(l.title)}">` : '📖'}
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(l.title)}</div>
            <div class="card-meta">
              <span class="tag tag-grade">${escapeHtml(l.grade_level)}</span>
              <span class="tag tag-subject">${escapeHtml(l.subject)}</span>
              <span class="tag tag-condition ${l.condition}">${escapeHtml(l.condition)}</span>
            </div>
            ${l.school ? `<div class="card-school">${escapeHtml(l.school)}</div>` : ''}
          </div>
        </article>
      `).join('')
    }

    function applyFilters() {
      const search = document.getElementById('search').value.toLowerCase().trim()
      const grade = document.getElementById('grade-filter').value
      const subject = document.getElementById('subject-filter').value
      const condition = document.getElementById('condition-filter').value

      const filtered = allListings.filter(l => {
        if (search && !l.title.toLowerCase().includes(search) && !l.subject.toLowerCase().includes(search)) return false
        if (grade && l.grade_level !== grade) return false
        if (subject && l.subject !== subject) return false
        if (condition && l.condition !== condition) return false
        return true
      })
      renderListings(filtered)
    }

    function showModal(listing) {
      const modal = document.getElementById('modal')
      const contactLink = getContactLink(listing.contact_method, listing.contact_value)
      const contactLabel = contactLabelFor(listing.contact_method)

      modal.innerHTML = `
        <div class="modal">
          <button class="modal-close" aria-label="Close">×</button>
          <div class="modal-image">
            ${listing.photo_url ? `<img src="${escapeHtml(listing.photo_url)}" alt="${escapeHtml(listing.title)}">` : '📖'}
          </div>
          <div class="modal-body">
            <h2>${escapeHtml(listing.title)}</h2>
            <div class="modal-tags">
              <span class="tag tag-grade">${escapeHtml(listing.grade_level)}</span>
              <span class="tag tag-subject">${escapeHtml(listing.subject)}</span>
              <span class="tag tag-condition ${listing.condition}">${escapeHtml(listing.condition)}</span>
            </div>
            ${listing.school ? `<div class="modal-section"><h3>School</h3><div>${escapeHtml(listing.school)}</div></div>` : ''}
            ${listing.description ? `<div class="modal-section"><h3>About this book</h3><div>${escapeHtml(listing.description)}</div></div>` : ''}
            <div class="modal-section">
              <h3>Get in touch</h3>
              <div class="contact-card">
                <div class="contact-name">${escapeHtml(listing.owner_name)}</div>
                <a href="${contactLink}" class="contact-link" target="_blank" rel="noopener">${contactLabel} ${escapeHtml(listing.contact_value)}</a>
              </div>
            </div>
          </div>
        </div>
      `
      modal.classList.remove('hidden')
      modal.querySelector('.modal-close').addEventListener('click', closeModal)
      modal.querySelector('.modal').addEventListener('click', e => e.stopPropagation())
      modal.addEventListener('click', closeModal)
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden')
    }

    function getContactLink(method, value) {
      const digits = String(value).replace(/\D/g, '')
      if (method === 'whatsapp') return `https://wa.me/${digits}`
      if (method === 'phone') return `tel:+${digits}`
      if (method === 'email') return `mailto:${value}`
      return '#'
    }

    function contactLabelFor(method) {
      if (method === 'whatsapp') return 'WhatsApp:'
      if (method === 'phone') return 'Call:'
      if (method === 'email') return 'Email:'
      return ''
    }

    function escapeHtml(s) {
      if (s == null) return ''
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    }

    document.getElementById('search').addEventListener('input', applyFilters)
    document.getElementById('grade-filter').addEventListener('change', applyFilters)
    document.getElementById('subject-filter').addEventListener('change', applyFilters)
    document.getElementById('condition-filter').addEventListener('change', applyFilters)

    document.getElementById('listings-grid').addEventListener('click', (e) => {
      const card = e.target.closest('.card')
      if (!card) return
      const listing = allListings.find(l => l.id === card.dataset.id)
      if (listing) showModal(listing)
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal()
    })

    loadListings()
  </script>
</body>
</html>
