<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenCycle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f8f5;
      color: #1a2e1f;
      line-height: 1.6;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
    h1 { font-size: 3rem; color: #2d6a3e; margin-bottom: 16px; }
    .tagline { font-size: 1.25rem; color: #4a6b52; margin-bottom: 40px; }
    p { margin-bottom: 16px; }
    .cta {
      display: inline-block;
      background: #2d6a3e;
      color: white;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 24px;
    }
    .cta:hover { background: #245532; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GreenCycle</h1>
    <p class="tagline">Coming soon — something good for you and the planet.</p>
    <p>We're building GreenCycle to make sustainable choices easier. Check back soon, or get in touch.</p>
    <a href="mailto:hello@example.com" class="cta">Get in touch</a>
  </div>
</body>
</html>
