<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Scratch artboard used only to render the 1024x500 Play Store feature
     graphic. Not part of the shipped site, not cached by the service worker.
     Fonts are referenced relative so Brave headless resolves them from ./fonts. */
  @font-face { font-family:'Fraunces'; src:url(fonts/fraunces-latin.woff2) format('woff2'); font-weight:400 700; font-display:swap; }
  @font-face { font-family:'Inter'; src:url(fonts/inter-latin.woff2) format('woff2'); font-weight:400 700; font-display:swap; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; background:#1c3f2c; }

  .art {
    position:absolute; inset:0; width:1024px; height:500px;
    background-color:#1c3f2c;
    background-image:
      radial-gradient(120% 140% at 14% 8%, #34674c 0%, #2b5941 42%, #1c3f2c 100%);
    font-family:'Inter', system-ui, sans-serif;
    color:#f6f1e6; overflow:hidden;
  }
  /* soft top-left light so the flat green gains depth */
  .art::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(45% 60% at 12% 0%, rgba(246,241,230,0.12), rgba(246,241,230,0) 60%);
    pointer-events:none;
  }
  /* faint gold horizon line: the "shelf" the whole brand sits on */
  .art::after {
    content:''; position:absolute; left:0; right:0; bottom:96px; height:1px;
    background:linear-gradient(90deg, rgba(217,169,74,0) 0%, rgba(217,169,74,0.55) 22%, rgba(217,169,74,0.55) 100%);
    pointer-events:none;
  }

  .copy { position:absolute; left:72px; top:0; bottom:0; width:600px;
          display:flex; flex-direction:column; justify-content:center; z-index:3; }

  .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brand svg { width:34px; height:34px; }
  .brand .name { font-family:'Fraunces', serif; font-weight:600; font-size:30px;
                 letter-spacing:-0.01em; color:#f6f1e6; }

  h1 { font-family:'Fraunces', serif; font-weight:600; font-size:58px; line-height:1.03;
       letter-spacing:-0.025em; color:#f9f5ec; text-wrap:balance; margin-bottom:20px; }
  h1 .leaf-word { color:#e7c979; font-style:italic; }

  .sub { font-size:21px; line-height:1.38; color:rgba(246,241,230,0.84); max-width:500px; }

  .pill { margin-top:24px; display:inline-flex; align-items:center; gap:10px;
          align-self:flex-start; padding:11px 20px; border-radius:999px;
          background:rgba(246,241,230,0.10); border:1px solid rgba(246,241,230,0.22);
          font-size:16px; font-weight:600; color:#f6f1e6; letter-spacing:0.01em; }
  .pill b { color:#e7c979; font-weight:700; }

  /* Book shelf on the right */
  .shelf { position:absolute; right:70px; bottom:96px; z-index:2;
           display:flex; align-items:flex-end; gap:11px; height:280px; }
  .book { width:44px; border-radius:5px 5px 2px 2px; position:relative;
          box-shadow:0 14px 30px -12px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.06); }
  /* top page-block highlight */
  .book::before { content:''; position:absolute; top:6px; left:7px; right:7px; height:3px;
                  border-radius:2px; background:rgba(255,255,255,0.35); }
  /* two spine lines */
  .book::after { content:''; position:absolute; left:8px; right:8px; bottom:22px; height:0;
                 border-top:2px solid rgba(0,0,0,0.10); box-shadow:0 9px 0 -1px rgba(0,0,0,0.08); }
  .b1 { height:196px; background:linear-gradient(180deg,#f4ede0,#e6dcc6); transform:rotate(-1.5deg); }
  .b2 { height:244px; background:linear-gradient(180deg,#e7c979,#cf9f43); }
  .b3 { height:170px; background:linear-gradient(180deg,#6fa382,#4d7f60); transform:rotate(1deg); }
  .b4 { height:222px; background:linear-gradient(180deg,#d98a5e,#bd6a3f); }
  .b5 { height:150px; background:linear-gradient(180deg,#f4ede0,#dfd4bb); transform:rotate(-1deg); }
  /* one book lying flat on top of the shelf, spanning a couple spines */
  .flat { position:absolute; right:70px; bottom:378px; z-index:2;
          width:150px; height:34px; border-radius:4px; transform:rotate(-3deg);
          background:linear-gradient(180deg,#f4ede0,#e2d7bf);
          box-shadow:0 12px 26px -10px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.06); }
  .flat::before { content:''; position:absolute; left:12px; right:12px; top:9px; height:2px;
                  background:rgba(0,0,0,0.12); box-shadow:0 7px 0 rgba(0,0,0,0.10); }
  .site { position:absolute; right:74px; bottom:52px; z-index:3;
          font-size:16px; font-weight:600; color:rgba(246,241,230,0.66); letter-spacing:0.02em; }
</style>
</head>
<body>
  <div class="art">
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e7c979" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" fill="#e7c979" fill-opacity="0.18"/>
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
        </svg>
        <span class="name">GreenShelf</span>
      </div>
      <h1>Pass your school<br>books <span class="leaf-word">on.</span></h1>
      <p class="sub">A free book exchange for families in Oman. No fees, no commission, no account needed to browse.</p>
      <span class="pill"><b>Free</b> forever, no sign-up to browse</span>
    </div>

    <div class="flat"></div>
    <div class="shelf">
      <div class="book b1"></div>
      <div class="book b2"></div>
      <div class="book b3"></div>
      <div class="book b4"></div>
      <div class="book b5"></div>
    </div>
    <div class="site">greenshelf.online</div>
  </div>
</body>
</html>
